<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">PRISMA flow diagram for the focused child anemia literature review</title>
  <desc id="desc">Twelve records were screened and ten studies were included.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.box{fill:#f7f3e8;stroke:#8d2f23;stroke-width:2}.side{fill:#edf3ed;stroke:#396a50;stroke-width:2}.arrow{stroke:#52616b;stroke-width:2;fill:none}</style>
  <text x="550" y="42" text-anchor="middle" font-size="25" font-weight="bold">PRISMA flow: focused review of child anemia in Peru</text>
  <rect class="box" x="330" y="80" width="440" height="105" rx="10"/>
  <text x="550" y="118" text-anchor="middle" font-size="18" font-weight="bold">Records identified</text>
  <text x="550" y="148" text-anchor="middle" font-size="16">PubMed (n = 10) + SciELO (n = 2)</text>
  <text x="550" y="171" text-anchor="middle" font-size="16">Total (n = 12)</text>
  <path class="arrow" d="M550 185 V245 M542 235 L550 245 L558 235"/>
  <rect class="box" x="330" y="250" width="440" height="90" rx="10"/>
  <text x="550" y="287" text-anchor="middle" font-size="18" font-weight="bold">Duplicates removed</text>
  <text x="550" y="317" text-anchor="middle" font-size="16">No duplicate records (n = 0)</text>
  <path class="arrow" d="M550 340 V400 M542 390 L550 400 L558 390"/>
  <rect class="box" x="330" y="405" width="440" height="90" rx="10"/>
  <text x="550" y="442" text-anchor="middle" font-size="18" font-weight="bold">Title and abstract screening</text>
  <text x="550" y="472" text-anchor="middle" font-size="16">Records screened (n = 12); exclusions (n = 0)</text>
  <path class="arrow" d="M550 495 V555 M542 545 L550 555 L558 545"/>
  <rect class="box" x="330" y="560" width="440" height="90" rx="10"/>
  <text x="550" y="597" text-anchor="middle" font-size="18" font-weight="bold">Full-text assessment</text>
  <text x="550" y="627" text-anchor="middle" font-size="16">Full texts assessed for eligibility (n = 12)</text>
  <path class="arrow" d="M770 605 H830 M820 597 L830 605 L820 613"/>
  <rect class="side" x="840" y="540" width="240" height="132" rx="10"/>
  <text x="960" y="578" text-anchor="middle" font-size="16" font-weight="bold">Full-text exclusions</text>
  <text x="960" y="609" text-anchor="middle" font-size="15">Wrong target age (n = 1)</text>
  <text x="960" y="637" text-anchor="middle" font-size="15">No usable 6-35 month</text>
  <text x="960" y="659" text-anchor="middle" font-size="15">stratum (n = 1)</text>
  <path class="arrow" d="M550 650 V720 M542 710 L550 720 L558 710"/>
  <rect class="side" x="330" y="725" width="440" height="100" rx="10"/>
  <text x="550" y="765" text-anchor="middle" font-size="19" font-weight="bold">Studies included in review</text>
  <text x="550" y="798" text-anchor="middle" font-size="17">Included studies (n = 10)</text>
  <text x="550" y="865" text-anchor="middle" font-size="14">Counts are calculated from screening_log.csv (search date: 31 July 2026).</text>
</svg>
